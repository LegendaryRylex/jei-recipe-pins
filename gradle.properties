org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.1.2
minecraft_version_range=[26.1,27)
neo_version=26.1.2.87
neo_version_range=[26.1.2.71,26.2)
loader_version_range=[4,)

mod_id=jeirecipepins
mod_name=JEI Recipe Pins
mod_license=MIT
mod_version=1.3.0
mod_group_id=dev.rylex.jeirecipepins
mod_authors=Rylex
mod_description=Pin a JEI recipe and keep it on screen while you gather its ingredients from chests and machines.

# public repo name; only needed because it differs from mod_id
public_repo=jei-recipe-pins

# set once the CurseForge project exists; blank disables the upload step in release-mod.ps1
curseforge_project_id=1688619
# optional; defaults to <minecraft_version>,NeoForge,Java 21
curseforge_game_versions=26.1.2,NeoForge,Java 25,Client,Server
# optional escape hatch when a version name is ambiguous
# curseforge_game_version_ids=
# CurseForge project slugs (last URL segment), mirroring neoforge.mods.toml dependencies
curseforge_required_dependencies=jei
curseforge_optional_dependencies=applied-energistics-2

jei_version=29.21.0.67
jei_version_range=[29.21.0,30)
ae2_version=26.1.12-beta
ae2_version_range=[26.1,27)

ftb_library_version=26.1.2.7
